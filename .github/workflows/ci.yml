name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # paths-filter lists a pull request's changed files through the API.
  pull-requests: read

jobs:
  # Work out which halves of the tree changed so each suite runs only when its
  # own code (or this workflow) did. Skipped jobs report as passing, so this
  # stays safe under required status checks. The Go filter covers everything
  # Go compiles or embeds: migrations/*.sql and web/dist/.keep included.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '.github/workflows/ci.yml'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'web/*.go'
              - 'web/dist/.keep'
            web:
              - '.github/workflows/ci.yml'
              - 'web/**'

  # The Go and web suites are independent, so run them as separate jobs in
  # parallel: the overall CI wall-clock is then max(go, web) rather than their
  # sum. Only the Go job needs Postgres; only the web job needs Node.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aerly
          POSTGRES_PASSWORD: aerly
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aerly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # testsupport connects here to CREATE/DROP an isolated DB per test.
      TEST_DATABASE_URL: postgres://aerly:aerly@127.0.0.1:5432/postgres?sslmode=disable
      # Fail (don't skip) DB-backed tests if Postgres is unreachable.
      AERLY_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./cmd/... ./internal/... ./migrations ./web

      - name: Go tests (per-file 90% coverage gate)
        run: |
          go test -covermode=set -coverprofile=coverage.out ./cmd/... ./internal/... ./migrations ./web
          go run ./cmd/coverage-gate -profile=coverage.out -min=90 -enforce

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Web typecheck
        run: npm run typecheck

      - name: Web lint
        run: npm run lint

      - name: Web tests (per-file 90% coverage gate)
        run: npm run test:coverage
